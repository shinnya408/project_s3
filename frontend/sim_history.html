<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シミュレーション - 過去の成績</title>
    <link rel="stylesheet" href="css/player_menu.css">
    <link rel="stylesheet" href="css/sim_player.css">
</head>
<body>
    <header class="sim-header">
        <div class="header-left">
            <button class="btn-text" id="btn-back">← メニューへ戻る</button>
            <h2 class="sim-page-title">📁 過去の成績 (シミュレーション)</h2>

    <main class="container" style="margin-top: 30px; max-width: 800px;">

            <p class="text-sub">履歴を読み込んでいます...</p>
