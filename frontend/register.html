<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link rel="stylesheet" href="css/exam_config.css">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <div id="toast-container" class="toast-notification"></div>
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <div class="header">
            <h1 style="margin: 0; font-size: 1.5em;">新規ユーザー登録</h1>
        </div>
        <div class="form-group">
            <label class="form-label">ユーザー名</label>
            <input type="text" id="username" class="form-control" placeholder="例: ヤマダ タロウ">
        </div>
        <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="email" class="form-control" placeholder="例: user@example.com">
        </div>
        <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" id="password" class="form-control" placeholder="パスワードを入力">
        </div>
        <button class="btn btn-success" style="width: 100%; margin-top: 10px;" onclick="register()">登録してログイン</button>
        <div style="margin-top: 20px; text-align: center; font-size: 0.9em;">
            <a href="login.html" style="color: var(--primary);">既にアカウントをお持ちの方はこちら</a>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
