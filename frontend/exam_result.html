<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模試結果</title>
    <link rel="stylesheet" href="css/exam_result.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="image/icon-192.png">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <!-- トースト通知用のコンテナ -->
    <div id="toast-container" class="toast-notification"></div>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="ライト/ダーク切替">🌙</button>

    <div class="container">
        <div class="header">
            <h1 class="page-title">📝 採点結果</h1>
            <button class="btn btn-outline" onclick="goToMenu()">🏠 メニューへ戻る</button>
        </div>

        <!-- スコア表示エリア -->
        <div class="score-card">
            <div class="score-circle">
                <span id="score-percent" class="score-percent">--%</span>
            </div>
            <div class="score-details">
                <h2 id="score-text" style="margin: 0; font-size: 1.8em;">-- / -- 問 正解</h2>
                <p id="score-message" style="color: var(--text-sub); margin-top: 10px;">採点中...</p>
            </div>
        </div>

        <!-- アクションボタンエリア -->
        <div class="action-bar">
            <button class="btn btn-primary" style="background-color: #f97316; color: #fff;" onclick="startRevengeMode()">🔥 リベンジ受験 (不正解のみ)</button>
            <button class="btn btn-primary" onclick="openTagModal()">🏷️ 出題問題に一括タグ付け</button>
            <button class="btn btn-primary" style="background-color: var(--success);" onclick="goToReviewPlayer()">🖥️ プレイヤー形式で見直す</button>
            <button class="btn btn-outline" onclick="window.location.href=`exam_history?workbookId=${workbookId}`">📊 過去の成績を見る</button>
        </div>

        <!-- 問題ごとの結果リスト -->
        <h3 class="section-title">問題ごとの結果</h3>
        <div id="result-list" class="result-list">
            <!-- JSで動的に生成 -->
        </div>
    </div>

    <!-- ＝＝＝ モーダル群 ＝＝＝ -->

    <!-- 一括タグ付けモーダル -->
    <div id="tag-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0;">🏷️ 一括タグ付け</h3>
                <button class="close-btn" onclick="closeModal('tag-modal')">×</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px;">今回の模試で出題されたすべての問題にタグを付けます。</p>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;">既存のタグから選択</label>
                    <div class="checkbox-group">
                        <!-- ★ 修正：JSで動的に実際のタグを生成します -->
                        <p style="color: var(--text-sub); font-size: 0.9em;">読込中...</p>
                    </div>
                </div>
                
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 10px;">新しいタグを作成</label>
                    <input type="text" id="new-tag-input" class="form-control" placeholder="例: 10月模試用">
                </div>
            </div>
            <div class="modal-footer" style="padding: 15px; border-top: 1px solid var(--border); text-align: right;">
                <button class="btn btn-primary" onclick="applyBatchTags()">保存する</button>
            </div>
        </div>
    </div>

    <!-- 見直し（解説）モーダル -->
    <div id="review-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="review-title" style="margin: 0;">見直し</h3>
                <button class="close-btn" onclick="closeModal('review-modal')">×</button>
            </div>
            <div class="modal-body">
                <div class="review-q-box">
                    <span id="review-id" class="badge" style="background: var(--border);">ID: --</span>
                    <p id="review-q-text" style="font-weight: bold; font-size: 1.1em; line-height: 1.5; margin-top: 10px;"></p>
                </div>
                
                <div class="review-ans-box" style="display: flex; gap: 20px; margin: 20px 0;">
                    <div style="flex: 1; padding: 15px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-main);">
                        <div style="font-size: 0.9em; color: var(--text-sub); margin-bottom: 5px;">あなたの解答</div>
                        <div id="review-user-ans" style="font-weight: bold; font-size: 1.1em;">--</div>
                    </div>
                    <div style="flex: 1; padding: 15px; border: 2px solid var(--success); border-radius: 8px; background: rgba(16, 185, 129, 0.05);">
                        <div style="font-size: 0.9em; color: var(--text-sub); margin-bottom: 5px;">正解</div>
                        <div id="review-correct-ans" style="font-weight: bold; font-size: 1.1em; color: var(--success);">--</div>
                    </div>
                </div>

                <div class="review-exp-box" style="padding: 15px; background: var(--bg-main); border-radius: 8px;">
                    <h4 style="margin-top: 0; color: var(--primary);">📖 解説</h4>
                    <p id="review-exp-text" style="line-height: 1.6; margin: 0;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ★ 追加：個別お気に入り追加・解除モーダル -->
    <div id="quiz-tag-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 style="margin: 0;">🏷️ お気に入りの追加・解除</h3>
                <button class="close-btn" onclick="closeModal('quiz-tag-modal')">×</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="quiz-new-tag-input" placeholder="新しいタグ名を入力" class="input-text" style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-main); color: var(--text-main);">
                    <button class="btn-primary" style="padding: 8px 15px; border: none; border-radius: 4px; background: var(--primary); color: white; cursor: pointer; font-weight: bold;" onclick="addNewTagFromQuiz()">作成</button>
                </div>
                
                <p style="font-size: 0.9em; color: var(--text-sub); margin-top: 0;">この問題に付けるタグをチェックしてください。</p>
                <div id="quiz-tag-checkboxes" class="checkbox-group" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- JSで動的に生成 -->
                </div>
            </div>
            <div class="modal-footer" style="padding: 15px; border-top: 1px solid var(--border); text-align: right;">
                <button class="btn" style="background: var(--primary); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;" onclick="saveQuizTags()">保存して閉じる</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/exam_result.js"></script>
</body>
</html>
