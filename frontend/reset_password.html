<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ↓追加: スマホで適切なサイズ（文字が小さくならないように）表示させるための必須タグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット</title>
    <link rel="stylesheet" href="css/exam_config.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="image/icon-192.png">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <div id="toast-container" class="toast-notification"></div>
    <!-- ↓変更: スマホ画面で横幅がいっぱいになりすぎないよう width: 90%; を追加し、余白を調整 -->
    <div class="container" style="width: 90%; max-width: 400px; margin: 30px auto;">
        <div class="header">
            <h1 style="margin: 0; font-size: 1.5em;">パスワード再設定</h1>
        </div>
        <p style="font-size: 0.9em; color: var(--text-sub);">登録時のメールアドレスとユーザー名が一致した場合のみ、パスワードが上書きされます。</p>
        <p style="font-size: 0.9em; color: var(--text-sub);">もしメールアドレスとユーザー名を忘れた場合、管理者に連絡してください。</p>
        <p style="font-size: 0.9em; color: var(--text-sub);">管理者が誰かわからない場合、マネージャーにお聞きください。</p>
        
        <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="email" class="form-control" placeholder="例: user@example.com">
        </div>
        <div class="form-group">
            <label class="form-label">ユーザー名</label>
            <input type="text" id="username" class="form-control" placeholder="登録したユーザー名">
        </div>
        
        <div class="form-group">
            <label class="form-label">新しいパスワード</label>
            <input type="password" id="new-password" class="form-control" placeholder="新しいパスワードを入力">
        </div>
        
        <button class="btn btn-primary" style="background-color: var(--danger); width: 100%; margin-top: 10px;" onclick="resetPassword()">パスワードをリセット</button>
        <div style="margin-top: 20px; text-align: center; font-size: 0.9em;">
            <a href="login" style="color: var(--primary);">ログイン画面へ戻る</a>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
