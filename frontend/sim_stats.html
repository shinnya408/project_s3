<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シミュレーション - 成績データ</title>
    <link rel="stylesheet" href="css/player_menu.css">
    <link rel="stylesheet" href="css/sim_player.css">
    <link rel="stylesheet" href="css/sim_stats.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="image/icon-192.png">
</head>
<body>
    <header class="sim-header">
        <div class="header-left">
            <button class="btn-text" id="btn-back" onclick="window.location.href=`sim_menu?workbookId=${new URLSearchParams(window.location.search).get('workbookId')}`">← メニューへ戻る</button>
            <h2 class="sim-page-title">📊 成績データ (シミュレーション)</h2>
        </div>
        <div class="header-right">
            <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" title="ライト/ダーク切替">🌙</button>
        </div>
    </header>

    <main class="container" style="margin-top: 30px; max-width: 800px;">
        <div id="loading-msg" class="text-sub">成績データを集計しています...</div>
        
        <div id="stats-content" style="display: none;">
            <!-- サマリーカード -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>総演習回数</h3>
                    <p class="value" id="stat-total-plays">0</p>
                </div>
                <div class="stat-card">
                    <h3>完璧クリア率 (満点)</h3>
                    <p class="value" id="stat-perfect-rate">0%</p>
                </div>
                <div class="stat-card">
                    <h3>平均スコア</h3>
                    <p class="value" id="stat-avg-score">0%</p>
                </div>
            </div>

            <!-- 問題別の最高スコアリスト -->
            <div class="task-list">
                <h3 style="margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid var(--border, #e2e8f0); padding-bottom: 10px;">📋 問題別の最高成績</h3>
                <div id="task-stats-container" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- JSでリストを生成 -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/sim_stats.js"></script>
</body>
</html>
