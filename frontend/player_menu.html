<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習メニュー</title>
    <!-- 分離したCSSファイルを読み込む -->
    <link rel="stylesheet" href="css/player_menu.css">
    <!-- PWA用マニフェストの読み込み -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <!-- トースト通知用のコンテナ -->
    <div id="toast-container" class="toast-notification"></div>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="ライト/ダーク切替">🌙</button>
    <div class="container" style="margin-top: 40px;">
        <div class="header">
            <!-- 一覧画面（index.htmlなど）に戻るボタン -->
            <a href="index.html" class="back-btn">← 問題集一覧へ</a>
            <h1 id="workbook-title" class="page-title">問題集を読み込み中...</h1>
        </div>

        <h2 class="section-title">学習モードを選択</h2>
        
        <div class="menu-grid">
            <!-- ① 確認モード -->
            <div class="menu-card" onclick="goToMode('practice')">
                <div class="icon">📖</div>
                <div class="menu-title">確認モード</div>
                <div class="menu-desc">1問1答形式でじっくり学習します。解答後すぐに解説を確認できます。</div>
            </div>

            <!-- ② 模試モード -->
            <div class="menu-card" onclick="goToMode('exam')">
                <div class="icon">🎯</div>
                <div class="menu-title">模試モード</div>
                <div class="menu-desc">条件を絞り込み、ランダム出題で本番さながらのテストを実施します。</div>
            </div>

            <!-- ③ お気に入り -->
            <div class="menu-card" onclick="goToMode('favorite')">
                <div class="icon">⭐</div>
                <div class="menu-title">お気に入り</div>
                <div class="menu-desc">チェックをつけた問題だけを集中的に復習します。</div>
            </div>
        </div>

        <h2 class="section-title stats-title">成績・データ</h2>
        
        <div class="stats-section">
            <!-- ④ 成績データ -->
            <div class="menu-card stats-card" onclick="goToMode('stats')">
                <div class="icon">📊</div>
                <div>
                    <div class="menu-title">成績データ</div>
                    <div class="menu-desc">全問題の正答率や苦手分野の統計を確認します。</div>
                </div>
            </div>

            <!-- ⑤ 過去の成績 -->
            <div class="menu-card stats-card" onclick="goToMode('history')">
                <div class="icon">📁</div>
                <div>
                    <div class="menu-title">過去の成績</div>
                    <div class="menu-desc">過去に実施した模試のスコア履歴を確認します。</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/player_menu.js"></script>
</body>
</html>
